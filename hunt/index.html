<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>電費單尋寶</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* 第一節「電費單尋寶」的練習：在帳單上點出度數、金額、計費期間、電力排碳量。版型與計算器同一套。 */
:root{
  --bg:#f3f6f4; --paper:#ffffff; --ink:#18302a; --muted:#56706a;
  --line:#cfdcd7; --accent:#0f7a63; --accent-ink:#ffffff; --warn:#b4541c; --ok:#1e9e4a;
  --font:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1a17; --paper:#17251f; --ink:#e4efe9; --muted:#9db5ad;
  --line:#2c3f38; --accent:#3cc29f; --accent-ink:#06261d; --warn:#f0a070; --ok:#5fd68c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a17; --paper:#17251f; --ink:#e4efe9; --muted:#9db5ad;
  --line:#2c3f38; --accent:#3cc29f; --accent-ink:#06261d; --warn:#f0a070; --ok:#5fd68c; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:clamp(26px,6vw,36px);font-weight:900;margin:0;letter-spacing:.02em}
.en{color:var(--accent);font-weight:700;margin:0}
.sub{color:var(--muted);margin:0}
.panel{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
h2{font-size:21px;margin:0}
button{font:inherit;cursor:pointer;color:var(--ink)}
button:focus-visible{outline:4px solid var(--accent);outline-offset:2px}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tier{text-align:left;padding:16px;border-radius:16px;border:3px solid var(--line);background:var(--paper);display:flex;flex-direction:column;gap:4px}
.tier b{font-size:22px}
.tier span{color:var(--muted);font-size:16px}
.tier[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{padding:10px 18px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.go{font-size:24px;font-weight:900;padding:16px;border-radius:14px;border:none;background:var(--accent);color:var(--accent-ink)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar .prog{font-weight:700;color:var(--muted)}
.bar .sp{flex:1}
.small{padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font-weight:700;font-size:16px}
.task{display:flex;gap:14px;align-items:center;padding:14px 18px;border-radius:16px;background:var(--paper);border:3px solid var(--tc,var(--accent))}
.task .num{flex:none;width:46px;height:46px;border-radius:50%;background:var(--tc,var(--accent));color:#fff;display:grid;place-items:center;font-size:26px;font-weight:900}
.task .q{font-size:clamp(22px,4.5vw,30px);font-weight:900;line-height:1.3}
.task .q small{font-size:.6em;font-weight:700;color:var(--muted);margin-left:8px}
.msg{min-height:30px;font-size:20px;font-weight:700}
.msg.ok{color:var(--ok)} .msg.no{color:var(--warn)}
.stage{position:relative;width:100%;max-width:max(320px,calc((100dvh - 350px) * 900 / 765));margin:0 auto;border-radius:12px;overflow:hidden;border:2px solid var(--line);background:#fff;touch-action:manipulation;cursor:crosshair;user-select:none}
.stage img.bill{display:block;width:100%;height:auto;pointer-events:none}
.ov{position:absolute;pointer-events:none;border-radius:10px}
.ov.found{border:5px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.ov.hint{border:5px dashed var(--c);animation:pulse 1s ease-in-out infinite}
.ov .stk{position:absolute;left:-30px;top:-30px;width:46px;height:46px;animation:pop .35s ease-out}
.dot{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;border:4px solid var(--warn);pointer-events:none;animation:fade 1s ease-out forwards}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--c) 35%,transparent)}}
@keyframes pop{from{transform:scale(.2)}to{transform:scale(1)}}
@keyframes fade{to{opacity:0;transform:scale(1.8)}}
@media (prefers-reduced-motion: reduce){.ov.hint,.ov .stk,.dot{animation:none}}
.found-list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.found-list li{display:flex;gap:10px;align-items:center;font-size:20px}
.found-list .chip{flex:none;min-width:30px;height:30px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:900}
.found-list .how{margin-left:auto;font-size:15px;color:var(--muted)}
.score{font-size:clamp(26px,6vw,38px);font-weight:900}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .go{flex:1;min-width:200px}
.alt{background:var(--paper);color:var(--ink);border:3px solid var(--accent)}
.note{font-size:15px;color:var(--muted)}
.voicepick{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:700}
.voicepick select{font:inherit;font-size:16px;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--paper);color:var(--ink);max-width:100%;flex:1;min-width:220px}
.voicepick button{padding:8px 16px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font-weight:700}
.voicepick .voicenote{flex-basis:100%;margin:0;font-size:15px;font-weight:400;color:var(--muted)}
a{color:var(--accent)}
/* 輪流上台（engine/activity.js 的 Act.turns） */
.turn{display:flex;flex-direction:column;gap:16px}
.turn .who{font-size:clamp(30px,6vw,46px);font-weight:900;text-align:center}
.log{width:100%;border-collapse:collapse;font-size:18px}
.log th,.log td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
.log th{color:var(--muted)}
.top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.home{font-size:16px;font-weight:700;color:var(--accent);text-decoration:none;border:2px solid var(--line);border-radius:12px;padding:6px 12px;background:var(--paper)}
.printbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.printbar button{padding:10px 16px;border-radius:12px;border:2px solid var(--line);background:var(--paper);font-weight:700}
</style>
<link rel="stylesheet" href="../engine/print.css">
</head>
<body>
<main class="wrap">
  <div class="top"><header>
    <h1>電費單尋寶</h1>
    <p class="en">Bill Treasure Hunt</p>
    <p class="sub">偵探任務：在電費單上找到寶藏，點一下！</p>
  </header><a class="home" href="../lesson/index.html">← 活動選單</a></div>

  <section id="setup" class="panel">
    <h2>怎麼玩</h2>
    <div class="seg" id="mode"></div>
    <div id="solo"><h2>選一個任務等級</h2>
    <div class="tiers" id="tiers"></div></div>
    <h2>朗讀與音效</h2>
    <div class="seg" id="opts"></div>
    <button class="go" id="start">開始尋寶 Start</button>
    <p class="note">輪流上台：每位上台前老師按 A／B／C 選等級，每人隨機抽一張帳單（不與上一位重複，要找的項目順序也每次打亂），畫面只顯示「第幾位」，不輸入名字。</p>
    <h2>🖨️ 列印紙本練習單</h2>
    <div class="printbar" id="printbar"><button data-print="A">A 練習單</button><button data-print="B">B 練習單</button><button data-print="C">C 練習單</button><button data-print="key">教師答案</button></div>
    <p class="note">每個等級印 3 頁（三張範例帳單各一頁，A4 直式），題目同遊戲；教師答案 1 頁。課後或回家再練習一次。</p>
    <p class="note">三張帳單都是教學範例（已去除個資），和教案附錄十四同一批。學生的作答只留在這個分頁，不會上傳。</p>
  </section>

  <section id="turn" class="panel" hidden></section>

  <section id="play" hidden>
    <div class="wrap" style="gap:12px">
      <div class="bar"><span class="prog" id="prog"></span><span class="sp"></span>
        <button class="small" id="again">🔊 再念一次</button><button class="small" id="hintbtn">💡 提示</button><button class="small" id="quit">回設定</button></div>
      <div class="task" id="task"></div>
      <div class="msg" id="msg" aria-live="polite"></div>
      <div class="stage" id="stage"><img class="bill" id="bill" alt="教學範例電費單"></div>
    </div>
  </section>

  <section id="done" class="panel" hidden></section>
</main>
<div id="printArea"></div>

<script src="../engine/tts-zh.js"></script>
<script src="../engine/sfx.js"></script>
<script src="../themes/save-power/theme.js"></script>
<script src="bills.js"></script>
<script src="../engine/activity.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const BILLS = window.HUNT_BILLS || [];
  const ART = (window.THEME && window.THEME.art) || {};
  const STICKER = ART.patrol ? '../themes/save-power/art/' + ART.patrol : '';
  const fmt = (n) => Number(n).toLocaleString('zh-TW');
  const sayDate = (p) => p.replace(/(\d+)\/(\d+)\/(\d+)/g, (_, y, m, d) => `${+y}年${+m}月${+d}日`).replace('至', '到');

  // 四個寶藏（顏色與編號＝標示版帳單的框）
  const T = {
    1: { zh: '度數', en: 'kWh', c: '#e0322b', val: (b) => `${fmt(b.kwh)} 度`, say: (b) => `${b.kwh}度`,
         hint: '在左邊「用戶資訊」裡，「經常度數」那一行的數字。', hintMk: '找紅色的框框，上面有 1。' },
    2: { zh: '金額', en: 'Amount', c: '#1f6fd1', val: (b) => `${fmt(b.total)} 元`, say: (b) => `${b.total}元`,
         hint: '找「應繳總金額」，就是這一期要繳的錢。', hintMk: '找藍色的框框，上面有 2。' },
    3: { zh: '計費期間', en: 'Billing Period', c: '#1e9e4a', val: (b) => b.period.replace('至', ' 至 '), say: (b) => sayDate(b.period),
         hint: '在左下角，「計費期間」後面的日期。', hintMk: '找綠色的框框，上面有 3。' },
    4: { zh: '電力排碳量', en: 'CO2', c: '#f08a00', val: (b) => `${fmt(b.co2)} 公斤`, say: (b) => `${b.co2}公斤`,
         hint: '在右邊「其他資訊」裡。', hintMk: '找橘色的框框，上面有 4。' },
  };
  // 三層（同教案附錄五的任務卡）：A 原版找四項；B 標示版找兩項；C 標示版只找度數，一開始就亮出位置
  const TIERS = {
    A: { name: 'A', desc: '原版帳單，找出度數、金額、計費期間、電力排碳量', ver: 'plain', tasks: [1, 2, 3, 4], hintAfter: 2, pad: 12 },
    B: { name: 'B', desc: '重點標示版，照紅框①、藍框②找度數和金額', ver: 'marked', tasks: [1, 2], hintAfter: 1, pad: 18 },
    C: { name: 'C', desc: '重點標示版，跟著閃動的紅框找度數', ver: 'marked', tasks: [1], hintAfter: 0, pad: 30 },
  };
  const S = { tier: 'B', speak: true, sfx: true, rot: true, bi: 0, ti: 0, wrong: 0, hinted: false, log: [] };
  window.GameSfx.enabled = () => S.sfx;
  const sfx = window.GameSfx.sfx;

  function speak(text) {
    if (!S.speak || !window.ZhTTS) return;
    const wait = Math.max(0, window.GameSfx.until() - performance.now());
    setTimeout(() => { try { speechSynthesis.cancel(); } catch (e) {} ZhTTS.speak(text, { voice: ZhTTS.pickTW() || undefined, rate: 0.9 }); }, wait);
  }
  document.addEventListener('pointerdown', () => { try { window.ZhTTS && ZhTTS.unlock(); } catch (e) {} }, { once: true });

  // ---- 設定 ----
  function renderSetup() {
    $('tiers').innerHTML = Object.entries(TIERS).map(([k, t]) =>
      `<button class="tier" data-tier="${k}" aria-pressed="${S.tier === k}"><b>${t.name}</b><span>${t.desc}</span></button>`).join('');
    const seg = (k, label) => `<span>${label}</span>` + [[true, '開'], [false, '關']].map(([v, l]) =>
      `<button data-opt="${k}" data-v="${v}" aria-pressed="${S[k] === v}">${l}</button>`).join('');
    $('opts').innerHTML = seg('speak', '朗讀') + '<span style="width:16px"></span>' + seg('sfx', '音效');
    $('mode').innerHTML = [[true, '輪流上台（每人一張）'], [false, '一個人玩三張']].map(([v, l]) =>
      `<button data-opt="rot" data-v="${v}" aria-pressed="${S.rot === v}">${l}</button>`).join('');
    $('solo').hidden = S.rot;
  }
  $('setup').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.tier) { S.tier = b.dataset.tier; renderSetup(); }
    if (b.dataset.opt) { S[b.dataset.opt] = b.dataset.v === 'true'; renderSetup(); if (window.Act) Act.S[b.dataset.opt] = S[b.dataset.opt]; if (b.dataset.opt === 'sfx' && S.sfx) sfx.good(); }
  });
  // 輪流上台：Act.turns 管「第 n 位 → 選層級 → 全班結果」，這裡只管一位同學找一張帳單
  const HOWRANK = { 獨立: 0, 提示: 1, 協助: 2 };
  const turns = window.Act && Act.turns({
    tiers: TIERS, resultCols: ['帳單', '找到的寶藏'], row: (x) => [`範例 ${x.bill}`, x.found],
    play: (tier, n, done) => { S.tier = tier; S.bi = pickBill(); S.seq = [S.bi]; S.k = 0; S.log = []; S.turnDone = done; show('play'); startBill(); },
  });
  $('start').addEventListener('click', () => {
    if (S.rot && turns) { Act.S.speak = S.speak; $('setup').hidden = true; turns.next(); return; }
    startSolo();
  });
  // ---- 列印練習單：用遊戲同一份帳單圖與題目（T），一張帳單一頁 ----
  const PRINTQ = {
    A: (b) => [1, 2, 3, 4].map((n) => `<li><span class="n" style="background:${T[n].c}">${n}</span>${T[n].zh}：${n === 3 ? '<span class="blank"></span> 至 <span class="blank"></span>' : `<span class="blank"></span> ${{ 1: '度', 2: '元', 4: '公斤' }[n]}`}</li>`),
    B: (b) => [1, 2].map((n) => `<li><span class="n" style="background:${T[n].c}">${n}</span>照${n === 1 ? '紅' : '藍'}框 ${n} 找到${T[n].zh}：<span class="blank"></span> ${n === 1 ? '度' : '元'}</li>`),
    C: (b) => [`<li><span class="n" style="background:${T[1].c}">1</span>用筆把紅框 1 圈起來。</li>`, `<li><span class="n" style="background:${T[1].c}">1</span>度數是 <span class="blank"></span> 度</li>`],
  };
  const sheetHd = (title) => `<div class="sh-hd"><h1>${title}</h1><div class="who">姓名：＿＿＿＿＿＿　日期：＿＿＿＿＿</div></div>`;
  function printSheets(which) {
    let h;
    if (which === 'key') {
      h = `<section class="sheet">${sheetHd('電費單尋寶 教師答案')}
        <table><thead><tr><th>範例帳單</th>${[1, 2, 3, 4].map((n) => `<th>${n} ${T[n].zh}</th>`).join('')}</tr></thead>
        <tbody>${BILLS.map((b) => `<tr><td>${b.key}：${b.title}</td>${[1, 2, 3, 4].map((n) => `<td>${T[n].val(b)}</td>`).join('')}</tr>`).join('')}</tbody></table>
        <p class="foot">A 找 1–4 四項（原版帳單）；B 找 1、2（重點標示版）；C 找 1 並圈出紅框（重點標示版）。</p></section>`;
    } else {
      const tr = TIERS[which];
      h = BILLS.map((b) => `<section class="sheet">${sheetHd(`電費單尋寶 練習單・${tr.name}`)}
        <img class="billimg" src="${b[tr.ver].img}" alt="範例帳單 ${b.key}">
        <ol class="qs">${PRINTQ[which](b).join('')}</ol>
        <p class="self">我是：☐ 自己找到　☐ 看提示找到　☐ 老師幫忙找到</p>
        <p class="foot">教學範例帳單，非真實帳單。</p></section>`).join('');
    }
    $('printArea').innerHTML = h;
    const imgs = [...$('printArea').querySelectorAll('img')];
    Promise.all(imgs.map((i) => i.complete ? 0 : new Promise((r) => { i.onload = i.onerror = r; }))).then(() => window.print());
  }
  $('printbar').addEventListener('click', (e) => { const b = e.target.closest('button[data-print]'); if (b) printSheets(b.dataset.print); });
  $('quit').addEventListener('click', () => { try { speechSynthesis.cancel(); } catch (e) {} show('setup'); });
  function show(id) { ['setup', 'turn', 'play', 'done'].forEach((x) => { $(x).hidden = x !== id; }); window.scrollTo(0, 0); }

  // ---- 遊戲 ----
  const tier = () => TIERS[S.tier];
  const bill = () => BILLS[S.bi];
  const ver = () => bill()[tier().ver];
  const tid = () => S.order[S.ti];
  // 隨機：帳單不跟上一位重複；同一張帳單裡要找的項目每次打亂順序
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  let lastBill = -1;
  function pickBill() {
    const pool = BILLS.map((_, i) => i).filter((i) => BILLS.length < 2 || i !== lastBill);
    return (lastBill = pool[Math.floor(Math.random() * pool.length)]);
  }
  function startSolo() { S.seq = shuffle(BILLS.map((_, i) => i)); S.k = 0; S.bi = S.seq[0]; S.log = []; show('play'); startBill(); }

  function startBill() {
    S.ti = 0; S.order = shuffle(tier().tasks); sfx.flip();
    $('bill').src = ver().img;
    $('stage').querySelectorAll('.ov,.dot').forEach((x) => x.remove());
    startTask(true);
  }
  function startTask(first) {
    S.wrong = 0; S.hinted = false; S.lock = false;
    const t = T[tid()], tr = tier();
    $('task').style.setProperty('--tc', t.c);
    $('task').innerHTML = `<span class="num">${tr.ver === 'marked' ? tid() : '?'}</span><span class="q">找出「${t.zh}」<small>${t.en}</small></span>`;
    $('prog').textContent = `${S.rot ? `範例帳單 ${bill().key}` : `帳單 ${S.k + 1}／${S.seq.length}`}・寶藏 ${S.ti + 1}／${tr.tasks.length}`;
    $('msg').textContent = ''; $('msg').className = 'msg';
    if (tr.hintAfter === 0) showHint();
    speak((first ? (S.rot ? '這是你的帳單。' : `第${S.k + 1}張帳單。`) : '') + `請找出${t.zh}，點一下。` + (tr.hintAfter === 0 ? t.hintMk : ''));
  }
  // 量好的框是 900 寬的帳單座標；換成百分比，畫面多寬都對得上
  function place(el, r, grow = 6) {
    const v = ver();
    el.style.left = (r[0] - grow) / v.w * 100 + '%'; el.style.top = (r[1] - grow) / v.h * 100 + '%';
    el.style.width = (r[2] + grow * 2) / v.w * 100 + '%'; el.style.height = (r[3] + grow * 2) / v.h * 100 + '%';
  }
  function showHint() {
    if (S.hinted) return; S.hinted = true;
    const n = tid(), r = ver().boxes[n][0], el = document.createElement('div');
    el.className = 'ov hint'; el.dataset.hint = n; el.style.setProperty('--c', T[n].c); place(el, r, 10);
    $('stage').appendChild(el);
  }
  function hit(x, y) {
    const v = ver(), pad = tier().pad;
    for (const n of [1, 2, 3, 4]) for (const r of v.boxes[n])
      if (x >= r[0] - pad && x <= r[0] + r[2] + pad && y >= r[1] - pad && y <= r[1] + r[3] + pad) return n;
    return 0;
  }
  $('stage').addEventListener('pointerup', (e) => {
    const rc = $('stage').getBoundingClientRect(), v = ver();
    const x = (e.clientX - rc.left) / rc.width * v.w, y = (e.clientY - rc.top) / rc.height * v.h;
    answer(hit(x, y), x, y);
  });
  function answer(n, x, y) {
    if (S.lock) return;                       // 找到後到下一題之前，再點不算
    const want = tid(), t = T[want], b = bill();
    if (n === want) {
      S.lock = true;
      $('stage').querySelectorAll(`.ov.hint[data-hint="${n}"]`).forEach((h) => h.remove());
      ver().boxes[n].forEach((r, i) => {
        const el = document.createElement('div'); el.className = 'ov found'; el.style.setProperty('--c', t.c); place(el, r);
        if (i === 0 && STICKER) el.innerHTML = `<img class="stk" src="${STICKER}" alt="">`;
        $('stage').appendChild(el);
      });
      const how = S.wrong === 0 && !S.hinted ? '獨立' : '提示';
      S.log.push({ bill: b.key, task: want, how: tier().hintAfter === 0 ? '協助' : how, tries: S.wrong + 1 });
      sfx.good();
      $('msg').className = 'msg ok'; $('msg').textContent = `找到了！${t.zh}是 ${t.val(b)}`;
      speak(`找到了！${t.zh}是${t.say(b)}。`);
      setTimeout(next, 2600);
      return;
    }
    S.wrong++;
    const d = document.createElement('div'); d.className = 'dot'; d.style.left = x / ver().w * 100 + '%'; d.style.top = y / ver().h * 100 + '%';
    $('stage').appendChild(d); setTimeout(() => d.remove(), 1000);
    sfx.gentle();
    const mk = tier().ver === 'marked';
    const say = (n ? `這是${T[n].zh}，我們要找的是${t.zh}。` : '再找找看。') + (mk ? t.hintMk : t.hint);
    $('msg').className = 'msg no'; $('msg').textContent = say;
    if (S.wrong >= Math.max(1, tier().hintAfter)) showHint();
    speak(say);
  }
  let busy = false;
  function next() {
    if (busy) return; busy = true; setTimeout(() => { busy = false; }, 300);
    if (S.ti + 1 < tier().tasks.length) { S.ti++; startTask(false); return; }
    if (S.rot || S.k + 1 < S.seq.length) { billDone(); return; }
    finish();
  }
  function billDone() {
    const b = bill();
    $('msg').className = 'msg ok';
    if (S.rot) {
      const how = S.log.reduce((w, x) => HOWRANK[x.how] > HOWRANK[w] ? x.how : w, '獨立');
      $('msg').innerHTML = `這張帳單的寶藏都找到了！<button class="small" id="nextbill" style="margin-left:10px">下一位 ✓</button>`;
      speak(`太棒了！你找到了${S.log.length}個寶藏。`);
      $('nextbill').addEventListener('click', () => S.turnDone({ bill: b.key, found: S.log.map((x) => T[x.task].zh).join('、'), how }), { once: true });
      return;
    }
    $('msg').innerHTML = `這張帳單的寶藏都找到了！<button class="small" id="nextbill" style="margin-left:10px">下一張 Next ▶</button>`;
    speak('這張帳單的寶藏都找到了！按下一張。');
    $('nextbill').addEventListener('click', () => { S.k++; S.bi = S.seq[S.k]; startBill(); }, { once: true });
  }
  function finish() {
    sfx.fanfare();
    const tot = S.log.length;
    const rows = BILLS.map((b) => {
      const items = S.log.filter((x) => x.bill === b.key).map((x) =>
        `<li style="--c:${T[x.task].c}"><span class="chip">${x.task}</span>${T[x.task].zh}：${T[x.task].val(b)}<span class="how">${x.how}${x.tries > 1 ? `・點了 ${x.tries} 次` : ''}</span></li>`).join('');
      return `<h2>範例帳單 ${b.key}：${b.title}</h2><ul class="found-list">${items}</ul>`;
    }).join('');
    $('done').innerHTML = `<div class="score">🎉 找到 ${tot} 個寶藏！</div>
      <p class="sub">${tier().name}・${['獨立', '提示', '協助'].map((h) => [h, S.log.filter((x) => x.how === h).length]).filter(([, c]) => c).map(([h, c]) => `${h === '獨立' ? '自己找到' : h === '提示' ? '看提示找到' : '在協助下找到'} ${c} 個`).join('、')}</p>${rows}
      <div class="row"><button class="go" id="replay">再玩一次</button><button class="go alt" id="back">換等級</button></div>
      <p class="note">教師紀錄：依協助程度（獨立／提示／協助）記入紀錄表。下一步：用 <a href="../calculator/index.html">碳排計算器</a> 把度數換成碳排。</p>`;
    show('done');
    speak(`太棒了！你找到了${tot}個寶藏。`);
    $('replay').addEventListener('click', startSolo);
    $('back').addEventListener('click', () => { renderSetup(); show('setup'); });
  }
  $('again').addEventListener('click', () => { const t = T[tid()]; speak(`請找出${t.zh}。` + (tier().ver === 'marked' ? t.hintMk : t.hint)); });
  $('hintbtn').addEventListener('click', () => { showHint(); const t = T[tid()]; speak(tier().ver === 'marked' ? t.hintMk : t.hint); });

  // 測試用：寶藏中心點（帳單座標）
  window.__hunt = { S, center: (n) => { const r = ver().boxes[n][0]; return [r[0] + r[2] / 2, r[1] + r[3] / 2]; }, answer, hit, next };
  renderSetup();
})();
</script>
