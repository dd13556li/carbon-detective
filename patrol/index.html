<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>教室巡守</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="../engine/activity.css">
<style>
/* 第二節 巡守任務的替代：教室裡有電器開著沒人用，點一下關掉；冰箱不能關。
   給「教室沒有可關的電器、或電器早就關了」的時候用，學生仍能練習判斷「哪些該關」 */
.room{position:relative;width:100%;aspect-ratio:16/10;border-radius:20px;overflow:hidden;border:3px solid var(--line);
  background:linear-gradient(#fdf6e3 0 66%,#d9b98c 66% 100%)}
.room .win{position:absolute;left:30%;top:9%;width:22%;height:34%;border:8px solid #ffffff;border-radius:6px;background:linear-gradient(#bfe4fb,#e8f6ff);box-shadow:0 0 0 2px #c9b99a}
.room .win::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:6px solid #fff}
.room .board{position:absolute;left:56%;top:10%;width:26%;height:26%;background:#2f5d4b;border:8px solid #b58a57;border-radius:6px}
.room .desk{position:absolute;left:4%;top:68%;width:30%;height:7%;background:#a8784a;border-radius:6px}
.room .desk::before,.room .desk::after{content:"";position:absolute;top:100%;width:6%;height:160%;background:#8b6238}
.room .desk::before{left:6%}.room .desk::after{right:6%}
.room .sock{position:absolute;left:48%;top:80%;width:3%;height:5%;background:#fff;border:2px solid #b7a98f;border-radius:4px}
.ap{position:absolute;width:var(--w,14%);aspect-ratio:1;padding:0;border:none;background:none;cursor:pointer;border-radius:16px}
.ap img,.ap svg{width:100%;height:100%;object-fit:contain;display:block;transition:filter .3s,opacity .3s}
.ap .tag{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);white-space:nowrap;font-size:clamp(12px,1.7vw,18px);font-weight:900;padding:1px 8px;border-radius:99px;background:var(--paper);border:2px solid var(--line);color:var(--ink)}
.ap.on img,.ap.on svg{filter:drop-shadow(0 0 10px #ffd400) drop-shadow(0 0 4px #ffb000)}
.ap.on .tag{border-color:#e0a800;background:#fff4c2;color:#5a4300}
.ap.off img,.ap.off svg{filter:grayscale(1) brightness(.8);opacity:.6}
.ap.off .tag{color:var(--muted)}
.ap.hint{animation:pulse 1s ease-in-out infinite}
.ap.wrong{animation:shake .4s}
.ap:focus-visible{outline:4px solid var(--accent);outline-offset:2px}
.room.dark{background:linear-gradient(#cfc8b6 0 66%,#a9906d 66% 100%)}
.left{font-size:24px;font-weight:900}
.safe{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.safe div{background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:700}
@media (prefers-reduced-motion: reduce){.ap.hint,.ap.wrong{animation:none}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <header><h1>教室巡守</h1><p class="en">Power Patrol · Turn off!</p>
      <p class="sub">教室裡有電器開著，可是沒有人在用。找出來，點一下把它關掉！</p></header>
    <a class="home" href="../lesson/index.html">← 活動選單</a>
  </div>
  <section id="setup" class="panel">
    <p>「減碳偵探的一天」巡守任務的替代練習：教室裡沒有可關的電器、或電器早就關了的時候，用這一頁練習判斷「哪些該關」。<b>冰箱要一直開著，不能關。</b></p>
    <h2>關電器前的安全守則</h2>
    <div class="safe"><div>✋ 手擦乾再碰開關</div><div>🔌 拔插頭要握插頭，不拉電線</div><div>🧊 冰箱不關</div><div>🙋 不確定就先問老師</div></div>
    <h2>朗讀與音效</h2>
    <div id="opts"></div>
    <button class="go" id="start">開始，第 1 位上台 ▶</button>
    <p class="note">輪流上台：每位上台前老師按 A／B／C 選等級，畫面只顯示「第幾位」，不輸入名字，結果只留在這個分頁。</p>
  </section>
  <section id="turn" class="panel" hidden></section>
  <section id="play" hidden>
    <div class="wrap" style="gap:14px">
      <div class="bar"><span class="prog" id="prog"></span><span class="sp"></span><span class="left" id="left"></span>
        <button class="small" id="again">🔊 再念一次</button><button class="small" id="hintbtn">💡 提示</button></div>
      <div class="room" id="room"></div>
      <div class="msg" id="msg" aria-live="polite"></div>
      <div class="row" id="acts"></div>
    </div>
  </section>
  <section id="done" class="panel" hidden></section>
</main>
<script src="../engine/tts-zh.js"></script>
<script src="../engine/sfx.js"></script>
<script src="../themes/save-power/icons.js"></script>
<script src="../themes/save-power/theme.js"></script>
<script src="../engine/activity.js"></script>
<script>
(function () {
  const { $, speak, speakEn, sfx, icon } = Act;
  // 教室裡的電器與位置（百分比）。fridge＝不能關的陷阱；其餘每局隨機挑幾樣「開著沒人用」
  const SPOTS = [
    { key: 'bulb',   name: '電燈',   x: 44, y: 0,  w: 12, offName: 'lightsOff' },
    { key: 'ac',     name: '冷氣',   x: 4,  y: 8,  w: 20 },
    { key: 'tv',     name: '電視',   x: 58, y: 38, w: 15 },
    { key: 'pcOn',   name: '電腦',   x: 10, y: 46, w: 15 },
    { key: 'fan',    name: '電扇',   x: 76, y: 44, w: 15 },
    { key: 'plug',   name: '延長線', x: 38, y: 70, w: 13 },
    { key: 'fridge', name: '冰箱',   x: 84, y: 14, w: 15, keep: true },
  ];
  const TIERS = {
    A: { name: 'A', desc: '自己找出全部開著的電器關掉，覺得關完了再按「巡守完成」', k: 4, count: false, blink: false, self: true },
    B: { name: 'B', desc: '畫面告訴你還有幾個沒關，全部關掉就完成', k: 3, count: true, blink: false, self: false },
    C: { name: 'C', desc: '開著的電器會閃動，跟著點就能關掉', k: 2, count: true, blink: true, self: false },
  };
  const P = {};
  const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const left = () => SPOTS.filter((s) => P.on.has(s.key));
  let lastSet = '';
  function play(tier, n, done) {
    const t = TIERS[tier];
    let pick; do { pick = shuffle(SPOTS.filter((s) => !s.keep)).slice(0, t.k).map((s) => s.key); } while (pick.slice().sort().join() === lastSet);
    lastSet = pick.slice().sort().join();
    Object.assign(P, { tier, n, done, on: new Set(pick), offed: [], wrong: 0, fridge: 0, hinted: false, over: false });
    $('prog').textContent = `第 ${n} 位・${t.name}`;
    $('room').innerHTML = '<div class="win"></div><div class="board"></div><div class="desk"></div><div class="sock"></div>' +
      SPOTS.map((s) => `<button class="ap" data-k="${s.key}" style="left:${s.x}%;top:${s.y}%;--w:${s.w}%">${icon(s.key, s.name)}<span class="tag"></span></button>`).join('');
    $('acts').innerHTML = t.self ? '<button class="go" id="fin">巡守完成 ✓</button>' : '';
    if (t.self) $('fin').addEventListener('click', selfDone);
    $('msg').className = 'msg'; $('msg').textContent = '';
    draw();
    if (t.blink) hint(true);
    speak(t.count ? `教室裡有${pick.length}個電器開著，沒有人在用。找出來，點一下關掉。` : '教室裡有電器開著，沒有人在用。找出來，點一下關掉。');
  }
  function draw() {
    const t = TIERS[P.tier];
    $('room').querySelectorAll('.ap').forEach((b) => {
      const s = SPOTS.find((x) => x.key === b.dataset.k), on = s.keep || P.on.has(s.key);
      b.classList.toggle('on', on); b.classList.toggle('off', !on);
      b.querySelector('.tag').textContent = s.name + (s.keep ? '・要開著' : on ? '・開著' : '・已關');
      b.setAttribute('aria-label', b.querySelector('.tag').textContent);
    });
    $('room').classList.toggle('dark', !P.on.has('bulb'));
    $('left').textContent = t.count && !P.over ? `還有 ${P.on.size} 個沒關` : '';
  }
  function hint(silent) {
    P.hinted = P.hinted || !silent;
    $('room').querySelectorAll('.ap').forEach((b) => b.classList.toggle('hint', P.on.has(b.dataset.k)));
  }
  $('room').addEventListener('click', (e) => {
    const b = e.target.closest('.ap'); if (!b || P.over) return;
    const s = SPOTS.find((x) => x.key === b.dataset.k);
    if (s.keep) {
      P.fridge++; sfx.gentle(); b.classList.add('wrong'); setTimeout(() => b.classList.remove('wrong'), 450);
      const say = '冰箱要一直開著，裡面的食物才不會壞掉，不能關喔！';
      $('msg').className = 'msg no'; $('msg').textContent = '🧊 ' + say; return speak(say);
    }
    if (!P.on.has(s.key)) {
      const say = `${s.name}已經關了，找找看還有哪個開著？`;
      $('msg').className = 'msg no'; $('msg').textContent = say; return speak(say);
    }
    P.on.delete(s.key); P.offed.push(s.name); b.classList.remove('hint'); sfx.step(); draw();
    $('msg').className = 'msg ok'; $('msg').textContent = `${s.name}關掉了！Turn off! 關掉！`;
    speak(`${s.name}關掉了！`, { onEnd: () => speakEn('Turn off!') });
    if (!TIERS[P.tier].self && P.on.size === 0) setTimeout(finish, 900);
  });
  function selfDone() {
    if (P.over) return;
    if (P.on.size) {
      P.wrong++; sfx.gentle();
      const say = P.wrong >= 2 ? `還有${P.on.size}個電器開著喔，看看閃動的地方。` : '還有電器開著喔，再仔細看看教室。';
      $('msg').className = 'msg no'; $('msg').textContent = say; speak(say);
      if (P.wrong >= 2) hint();
      return;
    }
    finish();
  }
  function finish() {
    P.over = true; sfx.good(); draw();
    const how = P.tier === 'C' ? '協助' : (P.wrong === 0 && !P.hinted ? '獨立' : '提示');
    const n = P.offed.length;
    $('msg').className = 'msg ok';
    $('msg').textContent = `巡守完成！關掉了 ${n} 個電器${P.fridge ? '，也記得冰箱不能關' : ''}。`;
    speak(`巡守完成！你關掉了${n}個沒人用的電器。`);
    $('acts').innerHTML = '<button class="go" id="next">下一位 ✓</button>';
    $('next').addEventListener('click', () => P.done({ list: P.offed.join('、'), fridge: P.fridge ? `點了 ${P.fridge} 次` : '—', how }), { once: true });
  }
  $('again').addEventListener('click', () => P.over ? speak('按下一位。') : speak('教室裡有電器開著，沒有人在用。找出來，點一下關掉。'));
  $('hintbtn').addEventListener('click', () => { if (!P.over && P.on.size) { hint(); speak(`找找看${left()[0].name}。`); } });
  Act.mountOptions($('opts'), '你好，我是朗讀的聲音。電燈關掉了！');
  const turns = Act.turns({ tiers: TIERS, play, resultCols: ['關掉的電器', '冰箱'], row: (x) => [x.list, x.fridge] });
  $('start').addEventListener('click', () => { $('setup').hidden = true; turns.next(); });
  window.__patrol = { P, SPOTS, left };
})();
</script>
</body>
</html>
