<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>電費單偵探隊：從家裡到教室的減碳任務</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="../engine/activity.css">
<style>
/* 整合選單：依上課順序列出兩節課用到的全部遊戲與動畫。老師在觸控電視上開這一頁，一路點下去 */
.sec{display:flex;flex-direction:column;gap:12px}
.sec h2{font-size:26px}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.act{display:grid;grid-template-columns:88px 1fr;gap:14px;align-items:center;text-decoration:none;color:var(--ink);background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:14px}
.act:hover,.act:focus-visible{border-color:var(--accent)}
.act img,.act svg{width:88px;height:88px;object-fit:contain}
.act .step{font-size:15px;font-weight:700;color:var(--accent)}
.act .nm{font-size:24px;font-weight:900;line-height:1.3}
.act .d{font-size:16px;color:var(--muted);line-height:1.45}
.act .kind{display:inline-block;font-size:13px;font-weight:900;padding:1px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);margin-left:6px;color:var(--muted)}
</style>
</head>
<body>
<main class="wrap">
  <header><h1>電費單偵探隊</h1><p class="sub" style="font-size:24px;font-weight:700;color:var(--ink)">從家裡到教室的減碳任務</p><p class="en">Bill Detectives · 教學遊戲與動畫</p>
    <p class="sub">依上課順序排好，在觸控電視上點開，學生輪流上台操作。全部免安裝、不收集任何資料。</p></header>
  <div id="root"></div>
  <p class="note">設計：純靜態網頁，朗讀自動選用高品質中文語音（Edge 曉臻、Chrome 雅婷），不必設定。輪流上台的結果只留在該分頁，重新整理就清除。</p>
</main>
<script src="../themes/save-power/icons.js"></script>
<script src="../themes/save-power/theme.js"></script>
<script src="../engine/lesson-list.js"></script>
<script>
(function () {
  const ART = window.THEME.art, IC = window.THEME_ICONS;
  const icon = (k) => ART[k] ? `<img src="../themes/save-power/art/${ART[k]}" alt="">` : `<svg viewBox="0 0 64 64" aria-hidden="true">${IC[k] || ''}</svg>`;
  const LESSON = window.LESSON;
  document.getElementById('root').innerHTML = LESSON.map((s) => `<section class="sec"><h2>${s.title}</h2><div class="list">${s.items.map((a) =>
    `<a class="act" href="${a.href}">${icon(a.icon)}<span><span class="step">${a.step}</span><span class="kind">${a.kind}</span><br><span class="nm">${a.nm}</span><br><span class="d">${a.d}</span></span></a>`).join('')}</div></section>`).join('');
  const cardImg = '<img src="../themes/save-power/images/meter.webp" alt="" style="border-radius:12px">';
  document.getElementById('root').insertAdjacentHTML('beforeend', `<section class="sec"><h2>兩節都用　雙語關鍵字卡</h2><div class="list">
    <a class="act" href="../cards/index.html">${cardImg}<span><span class="step">教學資源</span><span class="kind">字卡</span><br><span class="nm">雙語關鍵字卡</span><br><span class="d">度 kWh、碳雲 Carbon Cloud、淨零 Net Zero……共 ${window.THEME.words.length} 張，點卡片念中文再念英文，可放大、可列印</span></span></a></div></section>`);
  document.getElementById('root').insertAdjacentHTML('beforeend', `<section class="sec"><h2>課後　減碳身分認證</h2><div class="list">
    <a class="act" href="../cert/index.html">${icon('patrol')}<span><span class="step">兩節課上完</span><span class="kind">教師</span><br><span class="nm">減碳身分認證</span><br><span class="d">勾選每位同學完成的活動，按「檢查」看每人完成幾項、哪些還沒做</span></span></a></div></section>`);
  window.__lesson = LESSON;
})();
</script>
</body>
</html>
