<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我會說省電</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="../engine/activity.css">
<style>
/* 第二節 發展活動二：抽一張省電卡，練習對家人說出那一句（口語、跟讀或指圖卡） */
.deck{display:flex;justify-content:center;padding:10px 0}
.flip{width:min(560px,100%,max(240px,calc((100dvh - 470px) * 4 / 3)));aspect-ratio:4/3;perspective:1200px;border:none;background:none;padding:0}
.flip .in{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.flip.open .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;border:4px solid var(--line)}
.face.back{background:repeating-linear-gradient(45deg,var(--accent),var(--accent) 18px,color-mix(in srgb,var(--accent) 80%,#fff) 18px,color-mix(in srgb,var(--accent) 80%,#fff) 36px);color:#fff;font-size:44px;font-weight:900;text-shadow:0 2px 4px rgba(0,0,0,.3)}
.face.front{background:var(--paper);transform:rotateY(180deg)}
.face.front img,.face.front svg{width:46%;max-height:58%;object-fit:contain}
.face.front .short{font-size:30px;font-weight:900}
.face.front .en2{font-size:22px;font-weight:900;color:var(--accent)}
.cue{font-size:clamp(20px,3vw,26px);font-weight:900;text-align:center;margin:0 0 8px;color:var(--accent)}
.line{font-size:clamp(26px,4.6vw,40px);font-weight:900;text-align:center;line-height:1.45;padding:14px;border-radius:16px;background:var(--paper);border:3px solid var(--accent)}
@media (prefers-reduced-motion: reduce){.flip .in{transition:none}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <header><h1>我會說省電</h1><p class="en">I Can Say It!</p>
      <p class="sub">抽一張省電卡，練習對家人說一句省電的話</p></header>
    <a class="home" href="../lesson/index.html">← 活動選單</a>
  </div>

  <section id="setup" class="panel">
    <p>每張卡是棋盤遊戲裡學到的一個省電行動。學生抽到哪一張，就練習對家人說出那一句；三層的句子長短不同（A 是自然的完整句子，先叫一聲自己的家人再說；B 是「我們……，好嗎？」；C 是兩三個字的關鍵詞）。A：看句子自己說；B：點圖片出現句子並唸一次，跟著複誦；C：點圖片就唸一次，跟著說或用溝通圖卡指出來。</p>
    <h2>朗讀與音效</h2>
    <div id="opts"></div>
    <button class="go" id="start">開始，第 1 位上台 ▶</button>
  </section>

  <section id="turn" class="panel" hidden></section>

  <section id="play" hidden>
    <div class="wrap" style="gap:14px">
      <div class="bar"><span class="prog" id="prog"></span><span class="sp"></span>
        <button class="small" id="again">🔊 老師再念一次</button></div>
      <div class="deck"><button class="flip" id="flip" aria-label="抽一張卡"><div class="in">
        <div class="face back">抽一張！<br>Draw</div>
        <div class="face front" id="front"></div></div></button></div>
      <div class="msg" id="msg" aria-live="polite"></div>
      <div id="say" hidden>
        <p class="cue" id="cue" hidden>👋 先叫一聲你的家人，再說：</p>
        <div class="line" id="line"></div>
        <div class="row" style="margin-top:12px" id="tools"></div>
        <div class="row" style="margin-top:16px"><button class="go" id="donebtn">完成任務 ✓</button></div>
      </div>
    </div>
  </section>

  <section id="done" class="panel" hidden></section>
</main>

<script src="../engine/tts-zh.js"></script>
<script src="../engine/sfx.js"></script>
<script src="../themes/save-power/icons.js"></script>
<script src="../themes/save-power/theme.js"></script>
<script src="../engine/activity.js"></script>
<script>
(function () {
  const { $, speak, sfx, icon, TH } = Act;
  const CARDS = TH.sayCards;                                     // 唯一來源 theme.js
  const TIERS = {
    A: { name: 'A', desc: '卡片翻開就有句子，自己看著說出來（不播語音）' },
    B: { name: 'B', desc: '點圖片，出現句子並唸一次，跟著複誦' },
    C: { name: 'C', desc: '點圖片就唸一次（可以一直點），跟著說或用溝通圖卡指出來' },
  };
  // 三層各有自己的句子（theme.js：lineA 自然口語／line 固定句型／lineC 關鍵詞）
  const lineOf = (c, t) => ({ A: c.lineA, B: c.line, C: c.lineC }[t] || c.line);
  const P = {};
  let bag = [];
  const draw = () => { if (!bag.length) bag = CARDS.map((_, i) => i).sort(() => Math.random() - 0.5); return CARDS[bag.pop()]; };

  function play(tier, n, done) {
    Object.assign(P, { tier, n, done, card: null, said: [] });
    $('prog').textContent = `第 ${n} 位・${TIERS[tier].name}`;
    $('flip').classList.remove('open'); $('flip').disabled = false; $('flip').setAttribute('aria-label', '抽一張卡');
    $('say').hidden = true; $('msg').textContent = '';
    speak('點卡片，抽一張省電卡。');
  }
  // 抽卡：第一次點＝翻牌；翻開後再點圖片＝B 顯示句子並唸一次、C 唸一次（可重複）
  $('flip').addEventListener('click', () => {
    if (P.card) return tapImage();
    const c = P.card = draw(); P.said.push(c.short); P.heard = false; sfx.flip();
    $('front').innerHTML = `${icon(c.icon, c.short)}<div class="short">${c.short}</div>${c.en ? `<div class="en2">${c.en}</div>` : ''}`;
    $('flip').classList.add('open'); $('flip').setAttribute('aria-label', '點圖片聽這一句');
    setTimeout(reveal, 750);
  });
  function reveal() {
    const c = P.card, t = P.tier;
    $('say').hidden = false;
    $('line').textContent = lineOf(c, t);
    $('line').hidden = t === 'B';                       // B：點圖片才出現句子
    $('cue').hidden = t !== 'A';                        // A：句子不寫稱呼，學生自己叫家裡真的有的人
    $('tools').innerHTML = '<button class="go alt" id="nextline">下一句 ▶</button>';
    $('nextline').addEventListener('click', nextLine);
    $('msg').className = 'msg ok';
    $('msg').textContent = { A: `抽到：${c.short}。看著句子，自己說說看！`, B: `抽到：${c.short}。點圖片，看句子、聽一次，再跟著說。`, C: `抽到：${c.short}。點圖片聽一次，跟著說。` }[t];
    speak({ A: `你抽到${c.short}。看著句子，自己說說看。`, B: `你抽到${c.short}。點一下圖片。`, C: `你抽到${c.short}。點一下圖片。` }[t]);
  }
  function tapImage() {
    const c = P.card, t = P.tier;
    if (t === 'A') return;
    if (t === 'B') {
      if (P.heard) return;                              // B：只唸一次，之後學生自己複誦
      P.heard = true; $('line').hidden = false; $('msg').textContent = '換你跟著說一次！';
      return speak(lineOf(c, t));
    }
    speak(lineOf(c, t));                                // C：每點一次唸一次
  }
  // 下一句：同一位同學再抽一張練習（翻回背面再抽），老師最後按一次完成方式
  function nextLine() {
    P.card = null; $('say').hidden = true; $('msg').textContent = `已練習 ${P.said.length} 句，再抽一張！`;
    $('flip').classList.remove('open'); $('flip').setAttribute('aria-label', '抽一張卡'); sfx.step();
    speak('再抽一張，練習下一句。');
  }
  // 完成任務：回設定頁換下一位。完成方式依等級自動記（A 自己看句子說＝獨立、B 跟著複誦＝提示、C 跟著說或指圖卡＝協助），不用老師另選
  const HOW = { A: '獨立', B: '提示', C: '協助' };
  $('donebtn').addEventListener('click', () => {
    if (!P.card) return;
    sfx.good(); P.card = null;
    P.done({ card: P.said.join('、'), how: HOW[P.tier] });
  });
  // 🔊 給老師用：任何層級都可以再念一次
  $('again').addEventListener('click', () => { if (!P.card) return speak('點卡片，抽一張省電卡。'); if (P.tier === 'B') $('line').hidden = false; speak(lineOf(P.card, P.tier)); });

  Act.mountOptions($('opts'), '你好，我是朗讀的聲音。我們把冷氣調到二十六度，再開電扇，好嗎？');
  const turns = Act.turns({ tiers: TIERS, play, resultCols: ['練習的句子'], row: (x) => [x.card] });
  $('start').addEventListener('click', () => { $('setup').hidden = true; turns.next(); });
  window.__say = { P };
})();
</script>
</body>
</html>
